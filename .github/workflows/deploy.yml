name: Build and deploy

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          # Disposable CI-only fixture. No host ports or production credentials.
          MSSQL_SA_PASSWORD: 'Marks-CI-Only!2026-Database'
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Marks-CI-Only!2026-Database' -C -Q 'SELECT 1' -b"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build src/Api/MarksBaseballCards.Api.csproj -c Release

    - name: Isolated SQL Server photo and authorization tests
      env:
        MARKS_TEST_SQLSERVER: 'Server=sqlserver,1433;Database=MarksCardsTests_ci;User Id=sa;Password=Marks-CI-Only!2026-Database;Encrypt=True;TrustServerCertificate=True'
      run: dotnet test tests/MarksBaseballCards.Tests/MarksBaseballCards.Tests.csproj -c Release --verbosity minimal

  # Runs on the self-hosted runner on 192.168.1.210, copies the checkout to
  # /opt/Marks-BaseBallCards on 192.168.1.206 over SSH (alias marks-deploy-206 in
  # ~/.ssh/config) and builds/replaces the container there, so the stack is run
  # from /opt/<repo name> on 206 rather than from the runner's work folder.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [ self-hosted, marks-deploy ]
    concurrency:
      group: deploy-206
      cancel-in-progress: false
    env:
      DEPLOY_HOST: marks-deploy-206
      DEPLOY_DIR: /opt/Marks-BaseBallCards
      # Same project name as the original manual deploy, so compose replaces that container.
      COMPOSE_PROJECT_NAME: marks-baseballcards

    steps:
    - uses: actions/checkout@v7

    - name: Write .env
      env:
        ENV_FILE: ${{ secrets.ENV_FILE }}
      run: |
        umask 077
        printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
        sed -i 's/Database=MarksBaseballCards/Database=Website_Application_MarksBaseballCardsDb/g' .env
        if ! grep -Eq '^ConnectionStrings__Default=.*Database=Website_Application_MarksBaseballCardsDb([;]|$)' .env; then
          echo "::error::ENV_FILE must define ConnectionStrings__Default for Website_Application_MarksBaseballCardsDb."
          exit 1
        fi

    - name: Copy to /opt/Marks-BaseBallCards on 206
      run: |
        if ! ssh "$DEPLOY_HOST" "test -d '$DEPLOY_DIR' && test -w '$DEPLOY_DIR'"; then
          echo "::error::$DEPLOY_DIR must exist on 206 and be writable by the deploy user (sudo install -d -o htsadmin -g htsadmin -m 750 $DEPLOY_DIR)."
          exit 1
        fi
        # .env is excluded from the tree sync (which also protects it from --delete) and sent separately as 600.
        # The tree must stay world-readable: the Dockerfile COPYs it with its modes and the app runs as non-root.
        rsync -a --delete --chmod=Dgo+rx,Fgo+r --exclude=/.git/ --exclude=/.env ./ "$DEPLOY_HOST:$DEPLOY_DIR/"
        rsync -p --chmod=F600 .env "$DEPLOY_HOST:$DEPLOY_DIR/.env"

    - name: Build and replace container on 206
      run: ssh "$DEPLOY_HOST" "cd '$DEPLOY_DIR' && docker compose -p '$COMPOSE_PROJECT_NAME' up -d --build --remove-orphans"

    - name: Health check
      run: curl --fail --silent --show-error --output /dev/null --retry 30 --retry-all-errors --retry-delay 3 http://192.168.1.206:8090/health/live

    - name: Prune dangling images on 206
      if: success()
      run: ssh "$DEPLOY_HOST" "docker image prune -f"

    - name: Remove .env
      if: always()
      run: rm -f .env
